<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout :: head('Observatory | Traces')}"></head>
<body>
    <div class="app-container">
        <!-- Sidebar -->
        <aside th:replace="~{layout :: sidebar('traces')}"></aside>
 
        <!-- Main Content -->
        <main class="main-content" style="display: flex; padding: 0; max-width: none;">
            <!-- Trace Sidebar -->
            <div class="trace-sidebar glass">
                <div class="search-container">
                    <span class="filter-label">Trace Search</span>
                    <div style="position: relative;">
                        <input type="text" class="input-dark" placeholder="Search by Trace ID..." id="traceSearchInput">
                        <i class="fas fa-search" style="position: absolute; right: 10px; top: 12px; font-size: 0.8rem; color: var(--text-secondary);"></i>
                    </div>
                </div>

                <div class="filter-group">
                    <span class="filter-label">Service Filter</span>
                    <select class="input-dark" id="serviceFilter">
                        <option>All Services</option>
                    </select>
                </div>

                <div class="filter-group">
                    <span class="filter-label">Min Duration</span>
                    <input type="range" style="width: 100%;">
                </div>

                <div style="margin-top: 2rem;">
                    <span class="filter-label">Recent Traces</span>
                    <div id="recentTracesList" style="display: flex; flex-direction: column; gap: 0.75rem; margin-top: 1rem;">
                        <div class="text-secondary font-small">Loading traces...</div>
                    </div>
                </div>
            </div>

            <!-- Trace Visualization -->
            <div class="trace-content animate-fade-in">
                <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 2rem;">
                    <div>
                        <h2 class="main-title" style="font-size: 1.5rem; margin-bottom: 0.25rem;">Trace: <span class="text-mono text-info" id="traceIdDisplay">--</span></h2>
                        <p class="main-description" style="font-size: 0.875rem;">Total Duration: <span class="text-mono text-primary" id="traceDuration">--</span> | Spans: <span class="text-mono text-primary" id="traceSpanCount">--</span></p>
                    </div>
                    <div class="badge badge-info" id="traceEnvBadge">--</div>
                </div>

                <div class="glass" style="padding: 2rem;">
                    <div class="timeline-header" id="timelineHeader">
                        <div style="flex: 1;">--</div>
                    </div>
                    <div class="waterfall-container">
                        <div class="text-secondary" style="padding: 1rem;">Loading spans...</div>
                    </div>
                </div>
            </div>

            <!-- Metadata Panel -->
            <div class="metadata-panel animate-fade-in">
                <h3 class="card-title" style="margin-bottom: 1.5rem;">Span Details</h3>
                <div class="glass" style="padding: 1rem; margin-bottom: 1rem;">
                    <div class="filter-label">Span Name</div>
                    <div class="text-mono" style="margin-top: 0.25rem;" id="metaSpanName">Select a span</div>
                </div>
                <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; margin-bottom: 1.5rem;">
                    <div class="glass" style="padding: 1rem;">
                        <div class="filter-label">Duration</div>
                        <div class="text-mono text-success" style="margin-top: 0.25rem;" id="metaDuration">--</div>
                    </div>
                    <div class="glass" style="padding: 1rem;">
                        <div class="filter-label">Status</div>
                        <div class="text-mono text-success" style="margin-top: 0.25rem;" id="metaStatus">--</div>
                    </div>
                </div>

                <div class="filter-group">
                    <span class="filter-label">Attributes</span>
                    <div id="metaAttributes" style="display: flex; flex-direction: column; gap: 0.5rem; margin-top: 1rem;">
                        <div class="text-secondary font-small">No span selected</div>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <th:block th:replace="~{layout :: scripts}"></th:block>
    <script src="/js/traces.js"></script>
</body>
</html>
